<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Joseph Kamau – Founder of Alika, Engineer, Karateka" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140A2B"/>
      <stop offset="0.55" stop-color="#4A1A5C"/>
      <stop offset="1" stop-color="#C8125E"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="0.6" stop-color="#FF7AA8"/>
      <stop offset="1" stop-color="#FF3D8B"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140A2B" stop-opacity="0"/>
      <stop offset="1" stop-color="#140A2B" stop-opacity="0.85"/>
    </linearGradient>
    <ellipse id="petal" rx="7" ry="4" fill="#FFC2DC"/>
  </defs>

  <rect width="1200" height="340" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="120" cy="40" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="28" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="60" r="2"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="34" r="1.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="50" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="110" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- retro striped sun -->
  <circle cx="930" cy="215" r="125" fill="url(#sun)"/>
  <g fill="#7A1A5E">
    <rect x="790" y="222" width="280" height="6"/>
    <rect x="790" y="242" width="280" height="9"/>
    <rect x="790" y="264" width="280" height="12"/>
    <rect x="790" y="289" width="280" height="15"/>
  </g>

  <!-- mountains -->
  <polygon points="640,340 860,190 960,260 1040,215 1200,300 1200,340" fill="#1E0F33"/>
  <polygon points="820,218 860,190 900,218 880,214 860,224 840,214" fill="#F4E6F0"/>
  <polygon points="0,340 0,290 180,250 330,300 480,270 640,340" fill="#1E0F33"/>
  <rect width="1200" height="340" fill="url(#fade)"/>

  <!-- speed lines -->
  <g stroke="#FFFFFF" stroke-linecap="round" opacity="0.35">
    <line x1="40" y1="250" x2="220" y2="250" stroke-width="2"><animate attributeName="x1" values="40;-200;40" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="80" y1="268" x2="300" y2="268" stroke-width="1.5"><animate attributeName="x1" values="80;-160;80" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="20" y1="286" x2="160" y2="286" stroke-width="2"><animate attributeName="x1" values="20;-220;20" dur="1.9s" repeatCount="indefinite"/></line>
  </g>

  <!-- name -->
  <text x="72" y="100" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="28" font-weight="700" letter-spacing="8" fill="#FF7AA8">ジョセフ・カマウ</text>
  <text x="76" y="182" font-family="'Arial Black','Segoe UI',Arial,sans-serif" font-size="78" font-weight="900" letter-spacing="2" fill="#FF3D8B">JOSEPH KAMAU</text>
  <text x="72" y="178" font-family="'Arial Black','Segoe UI',Arial,sans-serif" font-size="78" font-weight="900" letter-spacing="2" fill="#FFFFFF">JOSEPH KAMAU</text>
  <text x="74" y="224" font-family="'Segoe UI',Arial,sans-serif" font-size="24" fill="#F4E6F0">Founder of Alika · Engineer · Karateka</text>

  <!-- vertical kanji: karate -->
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" opacity="0.8" text-anchor="middle"><text x="1160" y="90">空</text><text x="1160" y="126">手</text></g>

  <!-- falling sakura petals -->
  <g>
    <use href="#petal"><animateTransform attributeName="transform" type="translate" values="300,-20;180,360" dur="7s" repeatCount="indefinite"/></use>
    <use href="#petal"><animateTransform attributeName="transform" type="translate" values="520,-20;380,360" dur="9s" begin="-3s" repeatCount="indefinite"/></use>
    <use href="#petal"><animateTransform attributeName="transform" type="translate" values="700,-20;560,360" dur="8s" begin="-5s" repeatCount="indefinite"/></use>
    <use href="#petal"><animateTransform attributeName="transform" type="translate" values="880,-20;760,360" dur="10s" begin="-1s" repeatCount="indefinite"/></use>
    <use href="#petal"><animateTransform attributeName="transform" type="translate" values="1040,-20;900,360" dur="7.5s" begin="-4s" repeatCount="indefinite"/></use>
    <use href="#petal"><animateTransform attributeName="transform" type="translate" values="1180,-20;1040,360" dur="9.5s" begin="-6s" repeatCount="indefinite"/></use>
    <use href="#petal"><animateTransform attributeName="transform" type="translate" values="420,-20;300,360" dur="11s" begin="-7s" repeatCount="indefinite"/></use>
    <use href="#petal"><animateTransform attributeName="transform" type="translate" values="980,-20;860,360" dur="8.5s" begin="-2s" repeatCount="indefinite"/></use>
  </g>
</svg>
